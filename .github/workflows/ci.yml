name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # One job on GitHub's free ubuntu-latest runner. The README's "Test image and CI" gives the
    # estimate: about 15 minutes cold (nothing cached) and about 11 warm on 4 vCPUs.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    env:
      FILM_MODELS: /opt/models
    steps:
      - uses: actions/checkout@v4
      - run: git --version
      # ffmpeg for every render and decode; the fonts for walk's pages and the cards; sox and
      # espeak-ng for the test song; Python 3 and its venv for the audio and vision commands.
      - run: apt-get update && apt-get install -y --no-install-recommends ffmpeg fonts-inter fonts-noto-core fonts-noto-color-emoji fonts-noto-cjk sox espeak-ng python3 python3-pip python3-venv
      # The venv itself is cached, keyed on the pins and the image (its python is the image's).
      - uses: actions/cache@v4
        id: venv
        with:
          path: /opt/film-venv
          key: venv-playwright-1.63.0-noble-${{ hashFiles('src/film/py/requirements.txt') }}
      # CPU wheels of torch, torchaudio and torchvision first, from PyTorch's own index (the pins
      # are read from requirements.txt), then the rest.
      - if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python3 -m venv /opt/film-venv
          /opt/film-venv/bin/pip install --no-cache-dir $(grep -E '^(torch|torchaudio|torchvision)==' src/film/py/requirements.txt) --index-url https://download.pytorch.org/whl/cpu
          /opt/film-venv/bin/pip install --no-cache-dir -r src/film/py/requirements.txt
      - run: echo /opt/film-venv/bin >> "$GITHUB_PATH"
      # The four models (about 1.5 GB), downloaded only when the cache misses.
      - uses: actions/cache@v4
        id: models
        with:
          path: /opt/models
          key: models-${{ hashFiles('src/film/py/requirements.txt', 'src/film/py/film_py/models.py') }}
      - if: steps.models.outputs.cache-hit != 'true'
        run: python3 -I src/film/py/film_py/models.py --dest /opt/models
      # film:mix's four sounds, synthesised as the image build makes them (never committed). The
      # tests make their own; this step keeps sounds.py working where the image runs it.
      - run: python3 -I src/film/py/film_py/sounds.py --dest /opt/sounds
      - run: npm ci
      - run: npx remotion browser ensure
      - run: npm test
